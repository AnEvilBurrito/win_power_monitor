name: Android debug APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Verify and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper checksums
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint, and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK signature and ZIP alignment, then checksum
        working-directory: android/app/build/outputs/apk/debug
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum -c app-debug.apk.sha256
      - name: Retain verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wpm-android-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain test and lint diagnostics, including failed builds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wpm-android-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
