[package]
name = "wpm-cli"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "wpm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.29"
crossterm = "0.28"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
wmi = "0.14"
windows = { version = "0.59", features = ["Win32_System_Wmi"] }
windows-sys = { version = "0.59", features = ["Win32_System_Performance", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Foundation", "Win32_System_Power", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
